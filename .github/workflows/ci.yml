name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The projects target net8.0, but the solution is an .slnx and only the .NET 9.0.200
      # SDK and later can read that format. The SDK pin is deliberate and matches
      # global.json; do not lower it to the target framework.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore RhinoWorktreeLauncher.slnx
          dotnet build RhinoWorktreeLauncher.slnx -c Release --no-restore

      - name: Test
        shell: pwsh
        run: |
          dotnet vstest `
            tests/RhinoWorktreeLauncher.Tests/bin/Release/net8.0/RhinoWorktreeLauncher.Tests.dll `
            tests/RhinoWorktreeLauncher.UiTests/bin/Release/net8.0-windows/RhinoWorktreeLauncher.UiTests.dll
