name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The projects target net8.0, but the solution is an .slnx and only the .NET 9.0.200
      # SDK and later can read that format. The SDK pin is deliberate and matches
      # global.json; do not lower it to the target framework.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.version }}'
          } else {
            '${{ github.ref_name }}'.TrimStart('v')
          }
          "RWL_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Packaging builds but does not test. The suite spawns real child processes and waits
      # on their output, and on a hosted runner that wait does not return: run 32299772604
      # sat 46 minutes past "Starting test execution" without emitting a single result. The
      # same suite passes locally in 43 seconds. Tracked separately; restore this step only
      # once a runner can finish it.
      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore RhinoWorktreeLauncher.slnx
          dotnet build RhinoWorktreeLauncher.slnx -c Release --no-restore

      - name: Build self-contained package
        shell: pwsh
        run: |
          pwsh -NoProfile -File eng/New-RwlPackage.ps1 `
            -OutputPath artifacts/RhinoWorktreeLauncher `
            -Version $env:RWL_VERSION
          Compress-Archive `
            -Path artifacts/RhinoWorktreeLauncher/* `
            -DestinationPath "artifacts/RhinoWorktreeLauncher-$env:RWL_VERSION-win-x64.zip"
          $archive = "artifacts/RhinoWorktreeLauncher-$env:RWL_VERSION-win-x64.zip"
          $checksum = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$checksum *$([IO.Path]::GetFileName($archive))" | Set-Content -LiteralPath "$archive.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v7
        with:
          name: RhinoWorktreeLauncher-${{ env.RWL_VERSION }}-win-x64
          path: |
            artifacts/RhinoWorktreeLauncher-${{ env.RWL_VERSION }}-win-x64.zip
            artifacts/RhinoWorktreeLauncher-${{ env.RWL_VERSION }}-win-x64.zip.sha256

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "artifacts/RhinoWorktreeLauncher-$env:RWL_VERSION-win-x64.zip" `
            "artifacts/RhinoWorktreeLauncher-$env:RWL_VERSION-win-x64.zip.sha256" `
            --generate-notes `
            --verify-tag
